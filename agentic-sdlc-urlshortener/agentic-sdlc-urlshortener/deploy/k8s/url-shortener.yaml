apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
  labels: { app: url-shortener }
spec:
  replicas: 2
  selector:
    matchLabels: { app: url-shortener }
  template:
    metadata:
      labels: { app: url-shortener }
    spec:
      containers:
        - name: url-shortener
          image: url-shortener:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: app-secrets
          # Actuator health endpoints are public, so they make good probes.
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener
spec:
  selector: { app: url-shortener }
  ports:
    - port: 80
      targetPort: 8080
---
# Horizontal scaling for the read-hot shortener. Requires metrics-server in the cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: url-shortener
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: url-shortener
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
