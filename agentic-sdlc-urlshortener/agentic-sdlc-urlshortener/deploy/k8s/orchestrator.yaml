apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  labels: { app: orchestrator }
spec:
  # Single replica: run/audit/metrics state is in-memory in this prototype (see ARCHITECTURE.md
  # "Known limitations"). Scaling out requires externalizing that state first.
  replicas: 1
  selector:
    matchLabels: { app: orchestrator }
  template:
    metadata:
      labels: { app: orchestrator }
    spec:
      containers:
        - name: orchestrator
          image: orchestrator:latest
          ports:
            - containerPort: 8090
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8090 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8090 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
spec:
  selector: { app: orchestrator }
  ports:
    - port: 80
      targetPort: 8090
